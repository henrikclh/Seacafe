<body><header><a class="brand" href="./" aria-label="魚鳴嘴咖啡首頁"><span class="brand-mark">HAD</span><span>魚鳴嘴咖啡<small>COASTAL CAFÉ · DESIGN STUDY</small></span></a><div class="edition">四案設計比較<span>03 OCT 2026</span></div></header>
<main><aside aria-label="方案選擇"><div class="panel-heading"><span class="eyebrow">THE FOUR OPTIONS</span><h1>看見不同的可能</h1><p>選一個方案，探索建築與景觀。</p></div>
<div class="options" role="group" aria-label="切換設計方案">
<button class="option active" data-option="1" aria-pressed="true"><img src="assets/option-01.jpg" alt="方案一紅磚 L 型建築與泳池" width="320" height="190"><span class="option-copy"><b class="number">01</b><span><strong>虛實</strong><small>紅磚 · 光影長廊</small></span><span class="selected-mark" aria-hidden="true">●</span></span></button>
<button class="option" data-option="2" aria-pressed="false"><img src="assets/option-02.jpg" alt="方案二建築與前後雙水池" width="320" height="190"><span class="option-copy"><b class="number">02</b><span><strong>慢框</strong><small>雙水院 · 框景海岸</small></span><span class="selected-mark" aria-hidden="true">●</span></span></button>
<button class="option" data-option="3" aria-pressed="false"><img src="assets/option-03.jpg" alt="方案三折線花園與咖啡館" width="320" height="190"><span class="option-copy"><b class="number">03</b><span><strong>融景</strong><small>折線庭園 · 林下停留</small></span><span class="selected-mark" aria-hidden="true">●</span></span></button>
<button class="option" data-option="4" aria-pressed="false"><img src="assets/option-04.jpg" alt="方案四雙翼肋骨屋頂與曲線花園" width="320" height="190"><span class="option-copy"><b class="number">04</b><span><strong>展翅觀海</strong><small>雙翼屋頂 · 曲線花園</small></span><span class="selected-mark" aria-hidden="true">●</span></span></button></div>
<label class="retain"><input id="retain" type="checkbox" checked>切換時保留視角</label><p class="aside-note">建築與景觀方案研究 · 2026.10</p></aside>
<section class="viewer" aria-label="互動三維模型"><div id="canvas-wrap"><img id="poster" src="assets/option-01.jpg" alt="目前方案預覽"><canvas id="canvas" aria-label="3D 模型，拖曳旋轉，滾輪縮放" tabindex="0"></canvas></div>
<div class="viewer-top"><div class="view-title"><span id="option-code">OPTION 01</span><h2 id="option-name">虛實</h2></div><button id="fullscreen" class="icon-button" aria-label="全螢幕檢視" title="全螢幕"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div>
<div class="camera-controls" role="group" aria-label="預設視角"><button data-view="bird" class="chosen" aria-pressed="true">鳥瞰</button><button data-view="front" aria-pressed="false">正面</button><button data-view="top" aria-pressed="false">總平面</button><button data-view="arrival" aria-pressed="false">入場路線</button><button data-view="interior1" aria-pressed="false">室內一</button><button data-view="interior2" aria-pressed="false">室內二</button></div>
<div id="loading" role="status" aria-live="polite"><span class="spinner"></span><span id="loading-text">正在載入 3D 模型…</span><button id="retry" hidden>重新載入</button></div>
<div class="viewer-bottom"><div class="design-note"><span class="note-label">設計重點</span><p id="description">保留紅磚 L 型建築，挑出式格柵長廊連接水池與戶外停留空間。</p></div><div class="view-tools"><button id="reset" title="回到鳥瞰">重設視角</button><span class="gesture">拖曳旋轉 · 滾輪縮放 · 右鍵平移</span></div></div>
</section></main><noscript><p class="noscript">請啟用 JavaScript，以使用四案切換及 3D 模型。</p></noscript><script type="module" src="app.js"></script></body></html>
